[package]
name = "tondo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ctrlc = { version = "=3.5.2", features = ["termination"] }
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
toml.workspace = true
unicode-normalization.workspace = true
tondo-compiler = { path = "../tondo-compiler" }
tondo-conformance = { path = "../tondo-conformance" }
tondo-reference-adapter = { path = "../tondo-reference-adapter" }
tondo-vm = { path = "../tondo-vm" }

[lints]
workspace = true

[[bin]]
name = "tondo"
path = "src/main.rs"
