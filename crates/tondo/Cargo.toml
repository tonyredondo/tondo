[package]
name = "tondo"
description = "The Tondo compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tondo"
path = "src/main.rs"

[dependencies]
cranelift-codegen = { version = "0.137", features = ["x86", "arm64"] }
cranelift-frontend = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
cranelift-object = "0.137"
flate2 = "1"
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
libc = "0.2.191"
object = { version = "0.40", default-features = false, features = ["read", "std", "compression"] }
rustc-demangle = "0.1"
serde_json = "1"
unicode-ident = "1"
unicode-normalization = "0.1"
unicode-security = "0.1"

[build-dependencies]
flate2 = "1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tungstenite = "0.30.0"
