[package]
name = "tondo"
description = "The Tondo compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tondo"
path = "src/main.rs"

[dependencies]
cranelift-codegen = "0.137"
