[package]
name = "tondo-runtime"
description = "Runtime linked into every native Tondo executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The compiler's build script builds this crate with `cargo rustc` as a
# staticlib that it embeds; the rlib target exists for unit tests.
[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", features = ["sink"] }
hmac = "0.13.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "tokio", "http1", "http2"] }
libc = "0.2.191"
memchr = "2.8.3"
mimalloc = { version = "0.1", default-features = false }
mime_guess = "2.0.5"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
multer = "3.1.0"
regex = "1"
regex-syntax = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "multipart", "gzip", "brotli", "deflate", "system-proxy"] }
rmp = "0.8"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
saphyr = "0.2"
saphyr-parser = "0.2"
sha1 = "0.11.0"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "fs", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
webpki-roots = "1.0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tondo_staticlib)"] }

# A library for C is a shared object, which musl's loader refuses when it
# holds thread-local storage of the initial-exec model, mimalloc's default.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
