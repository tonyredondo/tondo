[workspace]
members = [
    "crates/tondo-cli",
    "crates/tondo-compiler",
    "crates/tondo-conformance",
    "crates/tondo-reliability",
    "crates/tondo-reference-adapter",
    "crates/tondo-stdlib",
    "crates/tondo-vm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.11.0"
unicode-ident = "=1.0.18"
unicode-normalization = "=0.1.24"
unicode-security = "=0.1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
