[workspace]
members = ["crates/tondo", "crates/tondo-runtime"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[profile.dev.package."*"]
opt-level = 2

# Cranelift's code generator with the branches on signed overflow fused, as
# vendor/README.md says.
[patch.crates-io]
cranelift-codegen = { path = "vendor/cranelift-codegen" }
