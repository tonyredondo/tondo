[package]
name = "tondo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
default = ["compiler-targets"]
compiler-targets = [
    "dep:tondo-compiler",
    "dep:tondo-conformance",
    "dep:tondo-reliability",
    "dep:tondo-vm",
]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0.151"
tondo-compiler = { path = "../crates/tondo-compiler", optional = true }
tondo-conformance = { path = "../crates/tondo-conformance", optional = true }
tondo-reliability = { path = "../crates/tondo-reliability", optional = true }
tondo-stdlib = { path = "../crates/tondo-stdlib" }
tondo-vm = { path = "../crates/tondo-vm", optional = true }

[[bin]]
name = "frontend"
path = "fuzz_targets/frontend.rs"
required-features = ["compiler-targets"]
test = false
doc = false
bench = false

[[bin]]
name = "protocols"
path = "fuzz_targets/protocols.rs"
required-features = ["compiler-targets"]
test = false
doc = false
bench = false

