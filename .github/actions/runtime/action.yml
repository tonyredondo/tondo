name: The runtime's builds
description: >
  Restores, or keeps for the next run, what crates/tondo/build.rs keeps of
  the runtimes it built, target/tondo-runtime/outputs, under the keys
  build.rs gives them: a build that finds its key there compiles no runtime.
inputs:
  label:
    description: What the runtimes are of, as the runner's system and the target.
    required: true
  save:
    description: "'true' after the build, to keep what it made."
    default: 'false'
runs:
  using: composite
  steps:
    # The most recent of this label: build.rs takes from it only the
    # runtimes whose key it computes, and lets go of the others.
    - if: inputs.save != 'true'
      uses: actions/cache/restore@v4
      with:
        path: target/tondo-runtime/outputs
        key: runtime-${{ inputs.label }}-
        restore-keys: runtime-${{ inputs.label }}-
    - if: inputs.save != 'true'
      shell: bash
      run: |
        mkdir -p target/tondo-runtime
        { ls target/tondo-runtime/outputs 2>/dev/null || true; } | sha256sum | cut -c1-16 > target/tondo-runtime/restored
    # Kept again only when the build made another runtime.
    - if: inputs.save == 'true'
      id: kept
      shell: bash
      # A directory that is not there lists nothing, under the -o pipefail
      # that Actions gives bash.
      run: |
        kept=$(ls target/tondo-runtime/outputs 2>/dev/null || true)
        names=$(printf '%s\n' "$kept" | sha256sum | cut -c1-16)
        restored=$(cat target/tondo-runtime/restored 2>/dev/null || true)
        if [ -n "$kept" ] && [ "$names" != "$restored" ]; then
          echo "names=$names" >> "$GITHUB_OUTPUT"
        fi
    - if: inputs.save == 'true' && steps.kept.outputs.names != ''
      uses: actions/cache/save@v4
      with:
        path: target/tondo-runtime/outputs
        key: runtime-${{ inputs.label }}-${{ steps.kept.outputs.names }}
