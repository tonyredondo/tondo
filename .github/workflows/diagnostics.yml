name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Diagnostic lane to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - race
          - leaks
          - crash
      fuzz:
        description: Run bounded diagnostic fuzzing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Hosted diagnostics (${{ inputs.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache diagnostic build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: tondo-diagnostics-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            tondo-diagnostics-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned diagnostic fuzz toolchain
        if: inputs.fuzz
        run: |
          rustup toolchain install nightly-2026-07-28 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run diagnostic promotion gate
        env:
          TONDO_DIAGNOSTIC_PROFILE: ${{ inputs.profile }}
          TONDO_DIAGNOSTIC_FUZZ_MODE: ${{ inputs.fuzz && 'smoke' || 'skip' }}
        run: bash scripts/diagnostic-ci.sh

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-ci-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/reliability/diagnostics-ci/
            target/reliability/fuzz-corpus/diagnostics/
            fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 14
