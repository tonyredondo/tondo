name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each job tests, then packs the `tondo` it built for its platform as an
# artifact: dist/tondo-<target>.tar.gz.
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-macos
          # The slowest runner: its clippy and the cases' other builds run
          # each night (nightly.yml).
          - os: macos-15-intel
            target: x86_64-macos
            light: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - if: ${{ !matrix.light }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Linking with the system's C compiler, as `TONDO_CC` asks.
      - if: ${{ !matrix.light }}
        run: cargo test -p tondo --test cases cases
        env:
          TONDO_CC: cc
      # Static executables, with musl (`--static`).
      - if: runner.os == 'Linux'
        run: cargo test -p tondo --test cases cases
        env:
          TONDO_CASES_STATIC: 1
      # Debug builds (`--debug`).
      - if: ${{ !matrix.light }}
        run: cargo test -p tondo --test cases
        env:
          TONDO_CASES_DEBUG: 1
      # Live builds (`--live`), whose calls go through slots.
      - if: ${{ !matrix.light }}
        run: cargo test -p tondo --test cases cases
        env:
          TONDO_CASES_LIVE: 1
      # The cases and projects where there is no C compiler, dynamic and
      # static.
      - if: runner.os == 'Linux'
        run: |
          cases=$(cargo test -p tondo --test cases --no-run 2>&1 | grep -o 'target/debug/deps/cases-[0-9a-f]*')
          run="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:$PWD -w $PWD"
          $run debian:stable-slim sh -c "! command -v cc && $cases cases projects"
          $run -e TONDO_CASES_STATIC=1 debian:stable-slim sh -c "! command -v cc && $cases cases"
      # On macOS, signed with the Developer ID and notarized, on pushes to
      # main: a fork's pull request has no secrets, and its build is not
      # signed.
      - run: dist/package.sh ${{ matrix.target }}
        env:
          MACOS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # The way in that the README and AGENTS.md give.
      - run: sh dist/install.sh "$RUNNER_TEMP/bin"
      - uses: actions/upload-artifact@v4
        with:
          name: tondo-${{ matrix.target }}
          path: dist/tondo-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # `--target` for the other architecture: its `tondo`, built across with
  # zig as the C compiler and linker, writes its pack under qemu's
  # emulation, as `docker run --platform` runs it, and this machine's
  # `tondo` builds for it with that pack. The tests run under emulation
  # each night (nightly.yml).
  targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: aarch64
            platform: linux/arm64
          - os: ubuntu-24.04-arm
            arch: x86_64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    # A hang under emulation fails the job instead of holding it for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@v2
      - uses: docker/setup-qemu-action@v3
      - uses: Swatinem/rust-cache@v2
      - name: Build tondo for ${{ matrix.arch }}
        run: |
          . .github/scripts/across.sh ${{ matrix.arch }}
          cargo build -p tondo --target ${{ matrix.arch }}-unknown-linux-gnu
      - name: Build for ${{ matrix.arch }} with its pack
        run: |
          docker run --rm --platform ${{ matrix.platform }} -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" \
            debian:stable-slim target/${{ matrix.arch }}-unknown-linux-gnu/debug/tondo target pack target/packs
          TONDO_TARGETS=$PWD/target/packs cargo test -p tondo --test targets

  # Linux with musl, as Alpine has it. The checkout and the cache run on the
  # host, since their Node cannot run on Alpine for arm64: the container's
  # cargo builds in the checkout's target and downloads to the host's
  # ~/.cargo.
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: >
          mkdir -p ~/.cargo/registry ~/.cargo/git &&
          docker run --rm -v "$PWD:/work" -w /work -e CARGO_INCREMENTAL=0
          -v "$HOME/.cargo/registry:/usr/local/cargo/registry" -v "$HOME/.cargo/git:/usr/local/cargo/git"
          rust:alpine sh -c
          "apk add --no-cache musl-dev zlib-dev zlib-static git curl tar &&
          (rustup show active-toolchain || rustup toolchain install) &&
          cargo test --workspace &&
          TONDO_CASES_STATIC=1 cargo test -p tondo --test cases cases &&
          cargo test -p tondo --test cases --no-run 2>&1 | grep -o 'target/debug/deps/cases-[0-9a-f]*' > target/cases &&
          dist/package.sh ${{ matrix.target }}"
      # The cases and projects where there is no C compiler, dynamic and
      # static.
      - run: |
          run="docker run --rm -v $PWD:/work -w /work"
          $run alpine sh -c "! command -v cc && $(cat target/cases) cases projects"
          $run -e TONDO_CASES_STATIC=1 alpine sh -c "! command -v cc && $(cat target/cases) cases"
      # What the containers wrote as root, for the cache to clean and keep.
      - run: sudo chown -R "$(id -u):$(id -g)" target ~/.cargo
      - uses: actions/upload-artifact@v4
        with:
          name: tondo-${{ matrix.target }}
          path: dist/tondo-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # The VS Code extension: its tests, then the .vsix as an artifact.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: tondo-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error
