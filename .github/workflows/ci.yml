name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each job tests, then packs the `tondo` it built for its platform as an
# artifact: dist/tondo-<target>.tar.gz.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15-intel
            target: x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Linking with the system's C compiler, as `TONDO_CC` asks.
      - run: cargo test -p tondo --test cases cases
        env:
          TONDO_CC: cc
      # Static executables, with musl (`--static`).
      - if: runner.os == 'Linux'
        run: cargo test -p tondo --test cases cases
        env:
          TONDO_CASES_STATIC: 1
      # Debug builds (`--debug`).
      - run: cargo test -p tondo --test cases
        env:
          TONDO_CASES_DEBUG: 1
      # The cases and projects where there is no C compiler, dynamic and
      # static.
      - if: runner.os == 'Linux'
        run: |
          cases=$(cargo test -p tondo --test cases --no-run 2>&1 | grep -o 'target/debug/deps/cases-[0-9a-f]*')
          run="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:$PWD -w $PWD"
          $run debian:stable-slim sh -c "! command -v cc && $cases cases projects"
          $run -e TONDO_CASES_STATIC=1 debian:stable-slim sh -c "! command -v cc && $cases cases"
      - run: dist/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tondo-${{ matrix.target }}
          path: dist/tondo-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # The compiler for the other architecture, built across with zig as the C
  # compiler and linker, and tested under qemu's emulation, as
  # `docker run --platform` runs it.
  qemu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: aarch64
            platform: linux/arm64
          - os: ubuntu-24.04-arm
            arch: x86_64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    # A hang under emulation fails the job instead of holding it for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.arch }}-unknown-linux-gnu ${{ matrix.arch }}-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: docker/setup-qemu-action@v3
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests for ${{ matrix.arch }}
        run: |
          set -o pipefail
          arch=${{ matrix.arch }}
          for target in $arch-linux-gnu.2.28 $arch-linux-musl; do ln -s "$PWD/dist/zig-cc" "$RUNNER_TEMP/$target-cc"; done
          export CC_${arch}_unknown_linux_gnu=$RUNNER_TEMP/$arch-linux-gnu.2.28-cc
          export CC_${arch}_unknown_linux_musl=$RUNNER_TEMP/$arch-linux-musl-cc
          export AR_${arch}_unknown_linux_gnu="zig ar" AR_${arch}_unknown_linux_musl="zig ar"
          export CARGO_TARGET_$(echo $arch | tr a-z A-Z)_UNKNOWN_LINUX_GNU_LINKER=$RUNNER_TEMP/$arch-linux-gnu.2.28-cc
          mkdir -p target
          cargo test --workspace --target $arch-unknown-linux-gnu --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .executable != null)
              | (.manifest_path | rtrimstr("Cargo.toml")) + " " + .executable' > target/emulated
      - name: Test under emulation
        run: >
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:$PWD" -w "$PWD"
          -e OWNER="$(id -u):$(id -g)" debian:stable-slim .github/scripts/emulated.sh
      # This machine's `tondo` builds for ${{ matrix.arch }} with the pack
      # the emulated one writes, and runs the program under emulation.
      - name: Build for ${{ matrix.arch }} with its pack
        run: |
          docker run --rm --platform ${{ matrix.platform }} -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" \
            debian:stable-slim target/${{ matrix.arch }}-unknown-linux-gnu/debug/tondo target pack target/packs
          TONDO_TARGETS=$PWD/target/packs cargo test -p tondo --test targets

  # Linux with musl, as Alpine has it. The checkout runs on the host, since
  # its Node cannot run on Alpine for arm64.
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker run --rm -v "$PWD:/work" -w /work rust:alpine sh -c
          "apk add --no-cache musl-dev zlib-dev zlib-static git curl tar &&
          (rustup show active-toolchain || rustup toolchain install) &&
          cargo test --workspace &&
          TONDO_CASES_STATIC=1 cargo test -p tondo --test cases cases &&
          cargo test -p tondo --test cases --no-run 2>&1 | grep -o 'target/debug/deps/cases-[0-9a-f]*' > target/cases &&
          dist/package.sh ${{ matrix.target }}"
      # The cases and projects where there is no C compiler, dynamic and
      # static.
      - run: |
          run="docker run --rm -v $PWD:/work -w /work"
          $run alpine sh -c "! command -v cc && $(cat target/cases) cases projects"
          $run -e TONDO_CASES_STATIC=1 alpine sh -c "! command -v cc && $(cat target/cases) cases"
      - uses: actions/upload-artifact@v4
        with:
          name: tondo-${{ matrix.target }}
          path: dist/tondo-${{ matrix.target }}.tar.gz
          if-no-files-found: error
