name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a run, which ends: the newer
# one tests everything before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The tests of each platform, and beside them the `tondo` built for each,
# packed as an artifact: dist/tondo-<target>.tar.gz. dist/install.sh takes
# a pack only from a run of main where every job passed.
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # A build asks for the glibc of where it is built, and so does what
          # it compiles: an old system, for what is published to run on most.
          - os: ubuntu-22.04
            target: x86_64-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-macos
          # The slowest runner: its clippy and the cases' other builds run
          # each night (nightly.yml).
          - os: macos-15-intel
            target: x86_64-macos
            light: true
    runs-on: ${{ matrix.os }}
    # A test that hangs fails the job instead of holding a runner for hours.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # Every build of the cases does not fit in what the runner leaves free.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: ${{ matrix.os }}-${{ matrix.target }}
      # The servers the tests of std.sql and std.acme speak to, which start
      # while the tests build: Pebble checks names on port 5001 of the host.
      - if: matrix.target == 'x86_64-linux-gnu'
        run: |
          docker run -d -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=tondo postgres:18
          docker run -d -p 127.0.0.1:3306:3306 -e MYSQL_ROOT_PASSWORD=secret -e MYSQL_DATABASE=tondo mysql:8.4
          docker run -d --name pebble --network host -e PEBBLE_VA_NOSLEEP=1 ghcr.io/letsencrypt/pebble
          docker cp pebble:/test/certs/pebble.minica.pem "$RUNNER_TEMP/pebble.pem"
          echo "TONDO_TEST_POSTGRES=postgres://postgres:secret@localhost:5432/tondo" >> "$GITHUB_ENV"
          echo "TONDO_TEST_MYSQL=mysql://root:secret@localhost:3306/tondo" >> "$GITHUB_ENV"
          echo "TONDO_TEST_ACME=https://localhost:14000/dir" >> "$GITHUB_ENV"
          echo "TONDO_TEST_ACME_TRUST=$RUNNER_TEMP/pebble.pem" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - if: ${{ !matrix.light }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TONDO_CI_DUMPS: ${{ runner.temp }}/dumps
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: ${{ matrix.os }}-${{ matrix.target }}
          save: true
      # Linking with the system's C compiler, as `TONDO_CC` asks.
      - if: ${{ !matrix.light }}
        run: cargo test --workspace --test cases cases
        env:
          TONDO_CC: cc
      # Static executables, with musl (`--static`).
      - if: runner.os == 'Linux'
        run: cargo test --workspace --test cases cases
        env:
          TONDO_CASES_STATIC: 1
      # Debug builds (`--debug`).
      - if: ${{ !matrix.light }}
        run: cargo test --workspace --test cases
        env:
          TONDO_CASES_DEBUG: 1
      # Every case recorded and replayed, which must end the same.
      - if: ${{ !matrix.light }}
        run: cargo test --workspace --test cases cases
        env:
          TONDO_CASES_REPLAY: 1
      # Live builds (`--live`), whose calls go through slots.
      - if: ${{ !matrix.light }}
        run: cargo test --workspace --test cases cases
        env:
          TONDO_CASES_LIVE: 1
      # The cases and projects where there is no C compiler, dynamic and
      # static.
      - if: runner.os == 'Linux'
        run: |
          cases=$(cargo test --workspace --test cases --no-run 2>&1 | grep -o 'target/debug/deps/cases-[0-9a-f]*')
          run="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:$PWD -w $PWD"
          $run debian:stable-slim sh -c "! command -v cc && $cases cases projects"
          $run -e TONDO_CASES_STATIC=1 debian:stable-slim sh -c "! command -v cc && $cases cases"
      # What hung says so by Tondo's own tools: the failures in the summary of
      # the run, and the dumps to open with `tondo dump serve`.
      - if: failure()
        run: .github/scripts/diagnose.sh "$RUNNER_TEMP/dumps"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dumps-${{ matrix.target }}
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore

  # The release `tondo` of each platform, built and packed while the tests
  # run, with the runtime the tests' job keeps.
  package:
    name: package (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15-intel
            target: x86_64-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: ${{ matrix.os }}-${{ matrix.target }}
      # On macOS, signed with the Developer ID and notarized, on pushes to
      # main: a fork's pull request has no secrets, and its build is not
      # signed.
      - run: dist/package.sh ${{ matrix.target }}
        env:
          MACOS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: ${{ matrix.os }}-${{ matrix.target }}
          save: true
      # The way in that the README and AGENTS.md give.
      - run: sh dist/install.sh "$RUNNER_TEMP/bin"
      - uses: actions/upload-artifact@v4
        with:
          name: tondo-${{ matrix.target }}
          path: dist/tondo-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # `--target` for the other architecture: its `tondo`, built across with
  # zig as the C compiler and linker, writes its pack under qemu's
  # emulation, as `docker run --platform` runs it, and this machine's
  # `tondo` builds for it with that pack. The tests run under emulation
  # each night (nightly.yml).
  targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: aarch64
            platform: linux/arm64
          - os: ubuntu-24.04-arm
            arch: x86_64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    # A hang under emulation fails the job instead of holding it for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # A version of its own, rather than the latest, which the action
      # reads from ziglang.org's index, at times not even JSON.
      # Without its cache, which kept one entry for each run and filled
      # Actions' cache: zig compiles a few files of C here.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - uses: docker/setup-qemu-action@v3
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: across-${{ matrix.os }}-${{ matrix.arch }}
      - name: Build tondo for ${{ matrix.arch }}
        run: |
          . .github/scripts/across.sh ${{ matrix.arch }}
          cargo build -p tondo --target ${{ matrix.arch }}-unknown-linux-gnu
      - name: Build for ${{ matrix.arch }} with its pack
        run: |
          docker run --rm --platform ${{ matrix.platform }} -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" \
            debian:stable-slim target/${{ matrix.arch }}-unknown-linux-gnu/debug/tondo target pack target/packs
          TONDO_TARGETS=$PWD/target/packs cargo test -p tondo --test targets
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: across-${{ matrix.os }}-${{ matrix.arch }}
          save: true

  # Linux with musl, as Alpine has it. The checkout and the cache run on the
  # host, since their Node cannot run on Alpine for arm64: the container's
  # cargo builds in the checkout's target and downloads to the host's
  # ~/.cargo.
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-linux-musl
    runs-on: ${{ matrix.os }}
    # A hang fails the job instead of holding it for hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: alpine-${{ matrix.target }}
      - run: >
          mkdir -p ~/.cargo/registry ~/.cargo/git &&
          docker run --rm -v "$PWD:/work" -w /work -e CARGO_INCREMENTAL=0
          -v "$HOME/.cargo/registry:/usr/local/cargo/registry" -v "$HOME/.cargo/git:/usr/local/cargo/git"
          rust:alpine sh -c
          "apk add --no-cache musl-dev zlib-dev zlib-static git curl tar &&
          (rustup show active-toolchain || rustup toolchain install) &&
          cargo test --workspace &&
          TONDO_CASES_STATIC=1 cargo test --workspace --test cases cases &&
          cargo test --workspace --test cases --no-run 2>&1 | grep -o 'target/debug/deps/cases-[0-9a-f]*' > target/cases"
      # The cases and projects where there is no C compiler, dynamic and
      # static.
      - run: |
          run="docker run --rm -v $PWD:/work -w /work"
          $run alpine sh -c "! command -v cc && $(cat target/cases) cases projects"
          $run -e TONDO_CASES_STATIC=1 alpine sh -c "! command -v cc && $(cat target/cases) cases"
      # What the containers wrote as root, for the cache to clean and keep.
      - if: ${{ !cancelled() }}
        run: sudo chown -R "$(id -u):$(id -g)" target ~/.cargo
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: alpine-${{ matrix.target }}
          save: true

  # The release `tondo` built with musl, packed while musl's tests run.
  package-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: alpine-${{ matrix.target }}
      - run: >
          mkdir -p ~/.cargo/registry ~/.cargo/git &&
          docker run --rm -v "$PWD:/work" -w /work -e CARGO_INCREMENTAL=0
          -v "$HOME/.cargo/registry:/usr/local/cargo/registry" -v "$HOME/.cargo/git:/usr/local/cargo/git"
          rust:alpine sh -c
          "apk add --no-cache musl-dev zlib-dev zlib-static git curl tar &&
          (rustup show active-toolchain || rustup toolchain install) &&
          dist/package.sh ${{ matrix.target }}"
      - if: ${{ !cancelled() }}
        run: sudo chown -R "$(id -u):$(id -g)" target ~/.cargo dist
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: alpine-${{ matrix.target }}
          save: true
      - uses: actions/upload-artifact@v4
        with:
          name: tondo-${{ matrix.target }}
          path: dist/tondo-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # What is published, on the oldest systems it says it runs on.
  floor:
    needs: [package, package-musl]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tondo-${{ matrix.arch }}-linux-*
          path: built
          merge-multiple: true
      - run: .github/scripts/floor.sh ${{ matrix.arch }} built

  # On one core a task that keeps its worker stops the others, which a runner
  # with more does not show.
  one-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: ubuntu-latest-x86_64-linux-gnu
      - run: cargo test -p tondo --test observe --test mcp --test live --test runbooks --no-run
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: ubuntu-latest-x86_64-linux-gnu
          save: true
      - run: taskset -c 0 cargo test -p tondo --test observe --test mcp --test live --test runbooks

  # The VS Code extension: its tests, then the .vsix as an artifact.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      # The extension in a real VS Code, with a `tondo` of this commit.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: ubuntu-latest-x86_64-linux-gnu
      - run: cargo build -p tondo
        working-directory: .
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: ubuntu-latest-x86_64-linux-gnu
          save: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb neovim
      - run: xvfb-run -a npm run test:editor
        env:
          TONDO_BIN: ${{ github.workspace }}/target/debug/tondo
      # And in an editor with nothing of ours but the server.
      - run: nvim --headless --clean -l testing/editors/neovim.lua target/debug/tondo
        working-directory: .
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: tondo-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error
