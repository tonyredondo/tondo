name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Linux with musl, as Alpine has it. The checkout runs on the host, since
  # its Node cannot run on Alpine for arm64.
  musl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker run --rm -v "$PWD:/work" -w /work rust:alpine sh -c
          "apk add --no-cache musl-dev zlib-dev zlib-static git curl tar &&
          (rustup show active-toolchain || rustup toolchain install) &&
          cargo test --workspace"
