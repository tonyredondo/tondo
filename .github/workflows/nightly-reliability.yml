name: Nightly reliability

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Extended fuzz campaigns
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install bounded fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-07-28 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run campaigns
        env:
          TONDO_FUZZ_SECONDS: "180"
        run: bash scripts/fuzz-campaign.sh

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts/
            target/reliability/fuzz-corpus/nightly/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Coverage and mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned quality tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo install cargo-mutants --version 27.1.0 --locked

      - name: Measure and enforce quality baselines
        run: bash scripts/quality-gate.sh

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/quality/
          if-no-files-found: error
          retention-days: 30
