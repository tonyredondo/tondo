name: Test

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      tier:
        description: Run the short feedback gate or the complete wave gate
        required: true
        default: full
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    name: Strict gate (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache fast build
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'fast'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tondo-fast-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            tondo-fast-${{ runner.os }}-${{ runner.arch }}-

      - name: Detect fast quality tools
        id: fast-tools
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'fast'
        env:
          TONDO_FAST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || 'HEAD^' }}
        run: |
          if git diff --name-only "$TONDO_FAST_BASE...HEAD" | grep -Eq '\.rs$'; then
            echo "install=true" >> "$GITHUB_OUTPUT"
          else
            echo "install=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install fast quality tools
        if: (github.event_name != 'workflow_dispatch' || inputs.tier == 'fast') && steps.fast-tools.outputs.install == 'true'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo install cargo-mutants --version 27.1.0 --locked

      - name: Run fast gate
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'fast'
        env:
          TONDO_TEST_TARGET: linux-x86_64
          TONDO_FAST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || 'HEAD^' }}
          CARGO_INCREMENTAL: "1"
        run: bash scripts/fast-gate.sh

      - name: Run full strict gate
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
        env:
          TONDO_TEST_TARGET: linux-x86_64
        run: bash scripts/test-gate.sh

      - name: Upload reproducible failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fast-gate evidence
        if: failure() && (github.event_name != 'workflow_dispatch' || inputs.tier == 'fast')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/fast-gate/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain draft conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/draft-manifest-*.json
          if-no-files-found: warn
          retention-days: 90

  portable:
    name: Portable (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            target-id: linux-aarch64
          - platform: macOS Intel
            runner: macos-15-intel
            target-id: macos-x86_64
          - platform: macOS Apple Silicon
            runner: macos-15
            target-id: macos-aarch64
          - platform: Windows x86_64
            runner: windows-2025
            target-id: windows-x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run portable tests, Cranelift probe and CLI smoke test
        shell: bash
        env:
          TONDO_TEST_TARGET: ${{ matrix.target-id }}
        run: bash scripts/platform-test.sh

      - name: Retain portable testing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-testing-${{ matrix.target-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/platform-test/${{ matrix.target-id }}/
          if-no-files-found: error
          retention-days: 14

  fuzz-smoke:
    name: Deterministic fuzz smoke
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install bounded fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-07-28 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run deterministic fuzz smoke
        run: bash scripts/fuzz-smoke.sh

      - name: Upload minimized fuzz failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts/
            target/reliability/fuzz-corpus/smoke/
          if-no-files-found: warn
          retention-days: 14
