name: Native evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Native backend selection evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache compiler build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tondo-native-evaluation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/native-evaluation/Cargo.lock', 'tools/native-evaluation/Cargo.toml') }}
          restore-keys: |
            tondo-native-evaluation-${{ runner.os }}-${{ runner.arch }}-

      - name: Install LLVM 18 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm-18
          test -x /usr/bin/llc-18
          echo "TONDO_LLVM_LLC=/usr/bin/llc-18" >> "$GITHUB_ENV"

      - name: Install bounded fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-07-28 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Install pinned quality tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo install cargo-mutants --version 27.1.0 --locked

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check native evaluation contract
        run: bash scripts/native-evaluation-check.sh

      - name: Run native evaluation negatives
        run: bash scripts/native-evaluation-test.sh

      - name: Generate real-MIR evidence
        run: bash scripts/native-evaluation.sh

      - name: Validate fast candidate lane
        run: bash scripts/native-evaluation-fast-check.sh

      - name: Measure Cranelift and LLVM candidates
        run: bash scripts/native-evaluation-fast.sh

      - name: Run scalar native executable differential lane
        run: bash scripts/native-evaluation-runner.sh

      - name: Run complete native AOT quality gate
        env:
          TONDO_NATIVE_AOT_QUALITY_USE_EXISTING: "1"
        run: bash scripts/native-aot-quality.sh

      - name: Capture complete native AOT performance
        run: bash scripts/native-aot-performance.sh

      - name: Bind candidate evidence for decision
        run: TONDO_NATIVE_SELECTION_REUSE=1 bash scripts/native-selection-capture.sh

      - name: Generate primary target and release evidence for N1
        run: |
          CARGO_TARGET_DIR=target bash scripts/native-target-test.sh
          CARGO_TARGET_DIR=target bash scripts/native-rel-test.sh

      - name: Upload N1 primary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-n1-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/reliability/evidence/native-evaluation.json
            target/reliability/evidence/native-evaluation-runner.json
            target/reliability/evidence/native-aot-quality.json
            target/reliability/evidence/native-aot-performance.json
            target/reliability/evidence/native-conf.json
            target/reliability/evidence/native-diff.json
            target/reliability/evidence/native-rel.json
            target/reliability/evidence/native-target.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload native evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-evaluation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload fast candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evaluation-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-evaluation-fast.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload scalar runner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evaluation-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-evaluation-runner.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload native AOT quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-aot-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-aot-quality.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload native AOT performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-aot-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-aot-performance.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-selection.json
          if-no-files-found: error
          retention-days: 14

  physical-arm64:
    name: N1 physical target (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run ARM64 physical target smoke
        shell: bash
        run: |
          mkdir -p target/platform-test/linux-aarch64
          CARGO_TARGET_DIR=target \
            TONDO_NATIVE_TARGET_EVIDENCE=target/platform-test/linux-aarch64/native-target.json \
            bash scripts/native-target-aarch64-test.sh

      - name: Upload ARM64 N1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-n1-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/platform-test/linux-aarch64/native-target.json
          if-no-files-found: error
          retention-days: 14

  promote:
    name: Promote Gate N1
    needs: [evaluate, physical-arm64]
    if: needs.evaluate.result == 'success' && needs.physical-arm64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download primary N1 evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: native-n1-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence

      - name: Download ARM64 N1 evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: native-n1-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/platform-test/linux-aarch64

      - name: Check N1 contract
        run: bash scripts/native-n1-check.sh --contract-only

      - name: Promote Gate N1
        run: bash scripts/native-n1.sh

      - name: Run N1 negative tests
        run: bash scripts/native-n1-test.sh

      - name: Upload N1 promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-n1-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-n1.json
          if-no-files-found: error
          retention-days: 90
