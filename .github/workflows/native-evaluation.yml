name: Native evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Native backend selection evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache compiler build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tondo-native-evaluation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/native-evaluation/Cargo.lock', 'tools/native-evaluation/Cargo.toml') }}
          restore-keys: |
            tondo-native-evaluation-${{ runner.os }}-${{ runner.arch }}-

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check native evaluation contract
        run: bash scripts/native-evaluation-check.sh

      - name: Run native evaluation negatives
        run: bash scripts/native-evaluation-test.sh

      - name: Generate real-MIR evidence
        run: bash scripts/native-evaluation.sh

      - name: Validate fast candidate lane
        run: bash scripts/native-evaluation-fast-check.sh

      - name: Measure Cranelift and LLVM candidates
        run: bash scripts/native-evaluation-fast.sh

      - name: Run scalar native executable differential lane
        run: bash scripts/native-evaluation-runner.sh

      - name: Bind candidate evidence for decision
        run: TONDO_NATIVE_SELECTION_REUSE=1 bash scripts/native-selection-capture.sh

      - name: Upload native evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-evaluation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload fast candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evaluation-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-evaluation-fast.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload scalar runner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evaluation-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-evaluation-runner.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/reliability/evidence/native-selection.json
          if-no-files-found: error
          retention-days: 14
