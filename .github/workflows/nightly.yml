name: Nightly

# What CI leaves out of each push for its time, each night and when asked:
# the tests under qemu's emulation, whose slowness brings out races, the
# sweeps of the tools over every case, debugging in containers, and on macOS
# for Intel, clippy and the cases' other builds.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # The tests built across for the other architecture, with zig as the C
  # compiler and linker, and run under qemu's emulation, as
  # `docker run --platform` runs them.
  emulated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: aarch64
            platform: linux/arm64
          - os: ubuntu-24.04-arm
            arch: x86_64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    # A hang under emulation fails the job instead of holding it for hours,
    # with room for the second try of `emulated.sh`.
    timeout-minutes: 270
    steps:
      # Its tests end, saying what runs, 25 minutes before the job's limit
      # would cut them with nothing said.
      - name: Note when the job's time ends
        run: echo "EMULATED_DEADLINE=$(( $(date +%s) + 245 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # A version of its own, rather than the latest, which the action
      # reads from ziglang.org's index, at times not even JSON; without its
      # cache, which kept one entry for each run and filled Actions' cache.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - uses: docker/setup-qemu-action@v3
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: emulated-${{ matrix.os }}-${{ matrix.arch }}
      - name: Build the tests for ${{ matrix.arch }}
        run: |
          set -o pipefail
          . .github/scripts/across.sh ${{ matrix.arch }}
          mkdir -p target
          cargo test --workspace --target ${{ matrix.arch }}-unknown-linux-gnu --no-run --message-format=json-render-diagnostics |
            jq -r 'select(.profile.test == true and .executable != null)
              | (.manifest_path | rtrimstr("Cargo.toml")) + " " + .executable' > target/emulated
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: emulated-${{ matrix.os }}-${{ matrix.arch }}
          save: true
      - name: Test under emulation
        run: >
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:$PWD" -w "$PWD"
          -e OWNER="$(id -u):$(id -g)" -e TONDO_CI_DUMPS="$PWD/target/dumps" -e EMULATED_DEADLINE
          debian:stable-slim .github/scripts/emulated.sh
      # What hung said of itself, to open with `tondo dump serve`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dumps-${{ matrix.arch }}
          path: target/dumps
          if-no-files-found: ignore

  # Debugging and post-mortems where programs run (containers.sh): on each
  # architecture, the scenarios in containers with a static tondo built as
  # Alpine builds it; then each one's dump read by the other's tondo.
  containers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl-${{ matrix.arch }}-linux-musl
          save-if: false
      - uses: ./.github/actions/runtime
        with:
          label: alpine-${{ matrix.arch }}-linux-musl
      - name: Build a static tondo
        run: >
          mkdir -p ~/.cargo/registry ~/.cargo/git &&
          docker run --rm -v "$PWD:/work" -w /work -e CARGO_INCREMENTAL=0
          -v "$HOME/.cargo/registry:/usr/local/cargo/registry" -v "$HOME/.cargo/git:/usr/local/cargo/git"
          rust:alpine sh -c
          "apk add --no-cache musl-dev zlib-dev zlib-static git curl tar &&
          (rustup show active-toolchain || rustup toolchain install) &&
          cargo build -p tondo"
      - run: .github/scripts/containers.sh target/debug/tondo out
      - uses: actions/upload-artifact@v4
        with:
          name: containers-${{ matrix.arch }}
          path: out
          if-no-files-found: error

  containers-across:
    needs: containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: containers-*
          path: out
      - run: |
          chmod +x out/*/tondo
          .github/scripts/containers.sh --across out/containers-x86_64 out/containers-aarch64

