name: Nightly

# What CI leaves out of each push for its time, each night and when asked:
# the tests under qemu's emulation, whose slowness brings out races, and
# on macOS for Intel, clippy and the cases' other builds.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # The tests built across for the other architecture, with zig as the C
  # compiler and linker, and run under qemu's emulation, as
  # `docker run --platform` runs them.
  emulated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: aarch64
            platform: linux/arm64
          - os: ubuntu-24.04-arm
            arch: x86_64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    # A hang under emulation fails the job instead of holding it for hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@v2
      - uses: docker/setup-qemu-action@v3
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests for ${{ matrix.arch }}
        run: |
          set -o pipefail
          . .github/scripts/across.sh ${{ matrix.arch }}
          mkdir -p target
          cargo test --workspace --target ${{ matrix.arch }}-unknown-linux-gnu --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .executable != null)
              | (.manifest_path | rtrimstr("Cargo.toml")) + " " + .executable' > target/emulated
      - name: Test under emulation
        run: >
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:$PWD" -w "$PWD"
          -e OWNER="$(id -u):$(id -g)" debian:stable-slim .github/scripts/emulated.sh

  # What the test job of CI leaves out on macOS for Intel.
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Linking with the system's C compiler, as `TONDO_CC` asks.
      - run: cargo test -p tondo --test cases cases
        env:
          TONDO_CC: cc
      # Debug builds (`--debug`).
      - run: cargo test -p tondo --test cases
        env:
          TONDO_CASES_DEBUG: 1
      # Live builds (`--live`), whose calls go through slots.
      - run: cargo test -p tondo --test cases cases
        env:
          TONDO_CASES_LIVE: 1
