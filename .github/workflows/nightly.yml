name: Nightly

# What CI leaves out of each push for its time, each night and when asked:
# the tests under qemu's emulation, whose slowness brings out races, the
# sweeps of the tools over every case, debugging in containers, and on macOS
# for Intel, clippy and the cases' other builds.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # The tests built across for the other architecture, with zig as the C
  # compiler and linker, and run under qemu's emulation, as
  # `docker run --platform` runs them.
  emulated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: aarch64
            platform: linux/arm64
          - os: ubuntu-24.04-arm
            arch: x86_64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    # A hang under emulation fails the job instead of holding it for hours,
    # with room for the second try of `emulated.sh`.
    timeout-minutes: 270
    steps:
      # Its tests end, saying what runs, 25 minutes before the job's limit
      # would cut them with nothing said.
      - name: Note when the job's time ends
        run: echo "EMULATED_DEADLINE=$(( $(date +%s) + 245 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # A version of its own, rather than the latest, which the action
      # reads from ziglang.org's index, at times not even JSON; without its
      # cache, which kept one entry for each run and filled Actions' cache.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - uses: docker/setup-qemu-action@v3
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/runtime
        with:
          label: emulated-${{ matrix.os }}-${{ matrix.arch }}
      - name: Build the tests for ${{ matrix.arch }}
        run: |
          set -o pipefail
          . .github/scripts/across.sh ${{ matrix.arch }}
          mkdir -p target
          cargo test --workspace --target ${{ matrix.arch }}-unknown-linux-gnu --no-run --message-format=json-render-diagnostics |
            jq -r 'select(.profile.test == true and .executable != null)
              | (.manifest_path | rtrimstr("Cargo.toml")) + " " + .executable' > target/emulated
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/runtime
        with:
          label: emulated-${{ matrix.os }}-${{ matrix.arch }}
          save: true
      - name: Test under emulation
        run: >
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:$PWD" -w "$PWD"
          -e OWNER="$(id -u):$(id -g)" -e TONDO_CI_DUMPS="$PWD/target/dumps" -e EMULATED_DEADLINE
          debian:stable-slim .github/scripts/emulated.sh
      # What hung said of itself, to open with `tondo dump serve`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dumps-${{ matrix.arch }}
          path: target/dumps
          if-no-files-found: ignore

