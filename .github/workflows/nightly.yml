name: Nightly

# What CI leaves out of each push for its time, each night and when asked:
# the tests under qemu's emulation, whose slowness brings out races, the
# sweeps of the tools over every case, and on macOS for Intel, clippy and
# the cases' other builds.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # The tests built across for the other architecture, with zig as the C
  # compiler and linker, and run under qemu's emulation, as
  # `docker run --platform` runs them.
  emulated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: aarch64
            platform: linux/arm64
          - os: ubuntu-24.04-arm
            arch: x86_64
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    # A hang under emulation fails the job instead of holding it for hours,
    # with room for the second try of `emulated.sh`.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # A version of its own, rather than the latest, which the action
      # reads from ziglang.org's index, at times not even JSON.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: docker/setup-qemu-action@v3
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests for ${{ matrix.arch }}
        run: |
          set -o pipefail
          . .github/scripts/across.sh ${{ matrix.arch }}
          mkdir -p target
          cargo test --workspace --target ${{ matrix.arch }}-unknown-linux-gnu --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .executable != null)
              | (.manifest_path | rtrimstr("Cargo.toml")) + " " + .executable' > target/emulated
      - name: Test under emulation
        run: >
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:$PWD" -w "$PWD"
          -e OWNER="$(id -u):$(id -g)" -e TONDO_CI_DUMPS="$PWD/target/dumps"
          debian:stable-slim .github/scripts/emulated.sh
      # What hung said of itself, to open with `tondo dump serve`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dumps-${{ matrix.arch }}
          path: target/dumps
          if-no-files-found: ignore

  # The editor's server on every case, whole and cut as writing leaves it,
  # the viewer of dumps on dumps with any field damaged, and the compiler on
  # programs broken at random.
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tondo --test lsp --test observe --test cli -- the_server_outlives a_damaged_dump the_compiler_outlives
        env:
          TONDO_SWEEP: 1
      # The concurrency of the standard library, in all of its orders.
      - run: cargo run -q -p tondo -- test tests/orders --schedules all
      # What a case says of its output holds in any order of its tasks
      # (testing 8.10), and each night tries others.
      - run: |
          for seed in 1 2 3; do
            TONDO_CASES_SCHEDULE="$GITHUB_RUN_NUMBER$seed" cargo test -p tondo --test cases cases
          done

  # The models of the runtime, in every order of their steps, with TLC as
  # `std.model` checks them, and random formulas both must judge the same.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p tondo
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c
          .github/scripts/models.sh "$RUNNER_TEMP/tla2tools.jar" target/release/tondo "$GITHUB_RUN_NUMBER"

  # The parsers of the standard library, searched for inputs that fail
  # (docs/refactor.md, 0.6). What fails stays in testing/fuzz/fuzz, to
  # commit, and the report prints it.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p tondo
      - run: target/release/tondo test testing/fuzz --fuzz --fuzz-time 1200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-store
          path: testing/fuzz/fuzz

  # Mutants of the scheduler's core and of strings and arrays, a slice a
  # night (docs/refactor.md, 0.8); what survives goes to the summary, to give
  # a test or to explain in testing/mutants/explained.txt.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: .github/scripts/mutants.sh "$((GITHUB_RUN_NUMBER % 40 + 1))/40" 3600 | tee "$RUNNER_TEMP/mutants.txt"
      - if: always()
        run: cat "$RUNNER_TEMP/mutants.txt" >> "$GITHUB_STEP_SUMMARY"

  # What the test job of CI leaves out on macOS for Intel.
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Linking with the system's C compiler, as `TONDO_CC` asks.
      - run: cargo test -p tondo --test cases cases
        env:
          TONDO_CC: cc
      # Debug builds (`--debug`).
      - run: cargo test -p tondo --test cases
        env:
          TONDO_CASES_DEBUG: 1
      # Every case recorded and replayed, which must end the same.
      - run: cargo test -p tondo --test cases cases
        env:
          TONDO_CASES_REPLAY: 1
      # Live builds (`--live`), whose calls go through slots.
      - run: cargo test -p tondo --test cases cases
        env:
          TONDO_CASES_LIVE: 1
