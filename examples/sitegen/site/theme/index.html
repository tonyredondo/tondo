{{ extends "base.html" }}
{{ block "title" }}{{ site }}{{ end }}
{{ block "main" }}
    <h1>{{ heading }}</h1>
    <ul>
    {{ for post in posts }}
      <li><a href="{{ post.url }}">{{ post.title }}</a> <small>{{ post.date }}</small></li>
    {{ else }}
      <li>Nothing here yet.</li>
    {{ end }}
    </ul>
{{ end }}
